name: CI - Train & Test

# Trigger only for pushes to dev branch
on:
  push:
    branches:
      - dev

jobs:
  train_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install scikit-learn joblib

      - name: Run training
        run: python train.py

      - name: Run tests
        run: python test.py
